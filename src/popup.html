<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQ 相册下载</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="15.7" cy="9" r="1.5" fill="currentColor"/><path d="m5 17 4.5-4.5a1 1 0 0 1 1.4 0l2.1 2.1 1.1-1.1a1 1 0 0 1 1.4 0L19 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-copy">
        <h1>QQ 相册下载</h1>
        <p>把空间里的照片保存到本地</p>
      </div>
      <a class="source-link" href="https://github.com/wawjswt/qq-zone-assistant" target="_blank" rel="noopener noreferrer" aria-label="查看源代码（在新标签页打开）" title="查看源代码">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.07c-3.1.67-3.75-1.32-3.75-1.32-.5-1.29-1.23-1.63-1.23-1.63-1.01-.7.07-.68.07-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.92.1-.72.39-1.22.7-1.5-2.47-.28-5.07-1.24-5.07-5.49 0-1.21.43-2.2 1.14-2.98-.11-.28-.5-1.41.1-2.94 0 0 .93-.3 3.05 1.14A10.6 10.6 0 0 1 12 6.42c.94 0 1.89.13 2.77.37 2.12-1.44 3.05-1.14 3.05-1.14.6 1.53.22 2.66.1 2.94.72.78 1.14 1.77 1.14 2.98 0 4.26-2.6 5.2-5.08 5.48.4.35.75 1.02.75 2.06v2.88c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
      </a>
    </header>

    <div class="divider"></div>

    <section class="settings" aria-label="下载设置">
      <div class="label-row"><label for="maxCount">最大下载数量</label><span class="optional">可选</span></div>
      <div class="input-wrap">
        <input type="number" id="maxCount" min="1" placeholder="不限制" aria-describedby="countHint">
        <span aria-hidden="true">张</span>
      </div>
      <p class="hint" id="countHint">留空即可下载全部照片</p>
    </section>

    <button id="downloadAblum" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>下载相册</span>
    </button>

    <div id="downloadBox" class="download-status" style="display: none;" aria-live="polite">
      <div class="status-heading">
        <div class="status-copy">
          <span id="statusTitle">正在下载</span>
          <span id="albumTitle"></span>
        </div>
        <span id="progressText">0%</span>
      </div>
      <progress id="progressBar" value="0" max="100" aria-label="下载进度"></progress>
      <p id="statusMessage" class="status-message"></p>
    </div>

    <footer><span class="footer-dot" aria-hidden="true"></span>请先在 QQ 空间打开需要下载的相册</footer>
  </main>
</body>
</html>
